[workspace]
resolver = "3"
members = ["crates/rannoch-core", "crates/rannoch-store", "crates/rannoch-events", "crates/rannoch-queue", "crates/rannoch-processor", "crates/rannoch-processor-agent", "crates/rannoch-processor-onnx", "crates/rannoch-processor-retrieve", "crates/rannoch-graph", "crates/rannoch-events-trim", "crates/rannoch-events-log"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
