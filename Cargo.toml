[workspace]
resolver = "3"
members = ["crates/rannoch-core", "crates/rannoch-app", "crates/rannoch-fixture", "crates/rannoch-store", "crates/rannoch-events"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
