[workspace]
resolver = "3"
members = [
    "crates/rannoch-probe",
    "crates/rannoch-store",
    "crates/rannoch-cloudevents",
    "crates/rannoch-ontology",
    "crates/rannoch-queue",
    "crates/rannoch-relay",
    "crates/rannoch-worker",
    "crates/rannoch-harness",
    "crates/rannoch-processor",
    "crates/rannoch-processor-store",
    "crates/rannoch-processor-lookup",
    "crates/rannoch-processor-count",
    "crates/rannoch-processor-emit",
    "crates/rannoch-processor-wait",
    "crates/rannoch-processor-approve",
    "crates/rannoch-processor-after",
    "crates/rannoch-processor-branch",
    "crates/rannoch-processor-bin",
    "crates/rannoch-processor-host",
    "crates/rannoch-processor-onnx",
]

# The version of record: release.toml points here, and each tag `v{version}` names it.
[workspace.package]
version = "0.4.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

# An unoptimized bundled SQLite makes the store's tests several times slower.
[profile.dev.package."*"]
opt-level = 3

