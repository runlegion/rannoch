[package]
name = "rannoch-graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
rannoch-core = { path = "../rannoch-core" }
rannoch-events = { path = "../rannoch-events" }
rannoch-processor = { path = "../rannoch-processor" }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1"

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["alloc", "clock"] }
log = "0.4"
rannoch-core = { path = "../rannoch-core", features = ["testing"] }
rannoch-processor-agent = { path = "../rannoch-processor-agent" }
rannoch-processor-retrieve = { path = "../rannoch-processor-retrieve" }
rannoch-queue = { path = "../rannoch-queue" }
rannoch-store = { path = "../rannoch-store" }
uuid = { version = "1", features = ["v7"] }

[lints]
workspace = true
