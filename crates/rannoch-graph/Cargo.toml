[package]
name = "rannoch-graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rannoch-core = { path = "../rannoch-core" }
rannoch-events = { path = "../rannoch-events" }
rannoch-processor = { path = "../rannoch-processor" }
rannoch-store = { path = "../rannoch-store" }
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"
uuid = "1"

[dev-dependencies]
rannoch-core = { path = "../rannoch-core", features = ["testing"] }
rannoch-queue = { path = "../rannoch-queue" }
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1", features = ["v7"] }

[lints]
workspace = true
