[package]
name = "rannoch-harness"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/runlegion/rannoch"
authors = ["Sean Silvius"]
description = "Holding the flow: loading the workers in the folder, reading guards and else, following next to a row or to another worker, rendering templates, handing each row to its processor, and committing what the processor declared together with the worker's place."
publish = false

[dependencies]
rannoch-worker = { path = "../rannoch-worker" }
rannoch-queue = { path = "../rannoch-queue" }
rannoch-store = { path = "../rannoch-store" }
rannoch-processor = { path = "../rannoch-processor" }

[lints]
workspace = true
