[package]
name = "rannoch-cloudevents"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/runlegion/rannoch"
authors = ["Sean Silvius"]
description = "The language rannoch speaks: a rannoch event to and from CloudEvents 1.0. Pure code with no I/O."
publish = false

[dependencies]
rannoch-ontology = { path = "../rannoch-ontology" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }

[lints]
workspace = true
