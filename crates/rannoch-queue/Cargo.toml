[package]
name = "rannoch-queue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["alloc", "clock"] }
log = "0.4"
rannoch-core = { path = "../rannoch-core" }
rusqlite = { version = "0.41", features = ["bundled"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
rannoch-core = { path = "../rannoch-core", features = ["testing"] }
rannoch-events = { path = "../rannoch-events" }
rannoch-processor = { path = "../rannoch-processor" }
rannoch-store = { path = "../rannoch-store" }
serde_json = "1"
uuid = { version = "1", features = ["v7"] }

[lints]
workspace = true
