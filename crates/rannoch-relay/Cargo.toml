[package]
name = "rannoch-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/runlegion/rannoch"
authors = ["Sean Silvius"]
description = "Relays: a declared shape's neighbourhood kept warm in memory, folded from the log, rebuildable from it."
publish = false

[dependencies]
rannoch-cloudevents = { path = "../rannoch-cloudevents" }
rannoch-queue = { path = "../rannoch-queue" }
rannoch-store = { path = "../rannoch-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
