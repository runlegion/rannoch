[package]
name = "rannoch-processor-onnx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["ort"]
ort = ["dep:ort"]
tract = ["dep:tract-onnx"]

[dependencies]
ort = { version = "=2.0.0-rc.10", optional = true }
rannoch-processor = { path = "../rannoch-processor" }
serde_json = "1"
tract-onnx = { version = "0.21", optional = true }

[dev-dependencies]
prost = "0.11"
rannoch-core = { path = "../rannoch-core", features = ["testing"] }
rannoch-events = { path = "../rannoch-events" }
rannoch-queue = { path = "../rannoch-queue" }
rannoch-store = { path = "../rannoch-store" }
rusqlite = { version = "0.41", features = ["bundled"] }
uuid = { version = "1", features = ["v7"] }

[[example]]
name = "fixture"
path = "tests/fixtures/generate.rs"
required-features = ["tract"]

[lints]
workspace = true
