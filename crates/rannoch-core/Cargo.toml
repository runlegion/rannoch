[package]
name = "rannoch-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false }
log = "0.4"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
migratr = "0.3"
rannoch-app = { path = "../rannoch-app", features = ["testing"] }
rannoch-events = { path = "../rannoch-events" }
rannoch-store = { path = "../rannoch-store" }
rusqlite = { version = "0.41", features = ["bundled"] }

[lints]
workspace = true
