[package]
name = "rannoch-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
testing = ["dep:forgr", "forgr/fake"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["now"] }
forgr = { version = "0.1", optional = true }
log = "0.4"
migratr = "0.3"
rannoch-settings = { path = "../rannoch-settings" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
forgr = { version = "0.1", features = ["fake"] }
rannoch-core = { path = ".", features = ["testing"] }
rannoch-events = { path = "../rannoch-events" }
rannoch-store = { path = "../rannoch-store" }
rusqlite = { version = "0.41", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "test-util"] }

[[bench]]
name = "inbox"
harness = false

[build-dependencies]
migratr = "0.3"
rusqlite = { version = "0.41", features = ["bundled"] }

[lints]
workspace = true
