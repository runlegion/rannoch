[package]
name = "rannoch-events-log"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
log = "0.4"
rannoch-core = { path = "../rannoch-core" }
rannoch-store = { path = "../rannoch-store" }

[dev-dependencies]
rannoch-core = { path = "../rannoch-core", features = ["testing"] }
rannoch-events = { path = "../rannoch-events" }
rannoch-processor = { path = "../rannoch-processor" }
rannoch-queue = { path = "../rannoch-queue" }
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"
uuid = { version = "1", features = ["v7"] }

[lints]
workspace = true
