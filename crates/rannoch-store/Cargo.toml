[package]
name = "rannoch-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
log = "0.4"
migratr = "0.3"
rannoch-core = { path = "../rannoch-core" }
rannoch-settings = { path = "../rannoch-settings" }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
rannoch-core = { path = "../rannoch-core", features = ["testing"] }
rannoch-events = { path = "../rannoch-events" }
tokio = { version = "1", features = ["macros", "test-util"] }

[lints]
workspace = true
