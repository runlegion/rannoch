[package]
name = "rannoch-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/runlegion/rannoch"
authors = ["Sean Silvius"]
description = "Rannoch's store, on SQLite."
publish = false

[dependencies]
rannoch-ontology = { path = "../rannoch-ontology" }
blake3 = "1.8"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }

[lints]
workspace = true
