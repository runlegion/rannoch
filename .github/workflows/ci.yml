name: ci
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo nextest run --workspace --all-features --no-tests=pass
      - run: cargo test --workspace --doc --all-features

  # The measurements (tests/measure.rs) run at verify time on Linux, macOS or Windows. Each
  # platform compiles and lints its own code for them, all three side by side with `check`, and
  # runs the probe's tests, which measure the machine they run on.
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test -p rannoch-probe
      # The memory allowed under a real limit: one probe test runs as root in a systemd scope
      # whose MemoryMax is 512 MiB, and is told to expect it.
      - if: runner.os == 'Linux'
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo systemd-run --scope --quiet -p MemoryMax=536870912 env RANNOCH_PROBE_EXPECT_LIMIT=536870912
        run: cargo test -p rannoch-probe --test probe -- --exact memory_allows_no_more_than_the_cgroup_limit
