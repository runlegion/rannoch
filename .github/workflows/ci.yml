name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip when there is no Cargo workspace
        id: ws
        run: |
          if [ -f Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No Cargo.toml: nothing to build, skipping."; echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.ws.outputs.present == 'true'
        with:
          components: rustfmt, clippy
      - name: fmt
        if: steps.ws.outputs.present == 'true'
        run: cargo fmt --all -- --check
      - name: clippy
        if: steps.ws.outputs.present == 'true'
        run: cargo clippy --all-targets -- -D warnings
      - name: cache potion-base-8M
        uses: actions/cache@v6
        if: steps.ws.outputs.present == 'true'
        with:
          path: |
            target/tmp/potion/model.safetensors
            target/tmp/potion/tokenizer.json
            target/tmp/potion/onnx/model.onnx
          key: potion-base-8M
      - name: test
        if: steps.ws.outputs.present == 'true'
        run: cargo test

  onnx:
    name: rannoch-processor-onnx through ort
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cache potion-base-8M
        uses: actions/cache@v6
        with:
          path: |
            target/tmp/potion/model.safetensors
            target/tmp/potion/tokenizer.json
            target/tmp/potion/onnx/model.onnx
          key: potion-base-8M
      - name: test
        run: cargo test -p rannoch-processor-onnx

  onnx-tract:
    name: rannoch-processor-onnx through tract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cache potion-base-8M
        uses: actions/cache@v6
        with:
          path: |
            target/tmp/potion/model.safetensors
            target/tmp/potion/tokenizer.json
            target/tmp/potion/onnx/model.onnx
          key: potion-base-8M
      - name: test
        run: cargo test -p rannoch-processor-onnx --features tract
