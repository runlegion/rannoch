name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip when there is no Cargo workspace
        id: ws
        run: |
          if [ -f Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No Cargo.toml: nothing to build, skipping."; echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.ws.outputs.present == 'true'
        with:
          components: rustfmt, clippy
      - name: fmt
        if: steps.ws.outputs.present == 'true'
        run: cargo fmt --all -- --check
      - name: clippy
        if: steps.ws.outputs.present == 'true'
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        if: steps.ws.outputs.present == 'true'
        run: cargo test
