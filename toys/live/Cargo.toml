[package]
name = "rannoch-live"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
rannoch-store = { path = "../../crates/rannoch-store" }
rannoch-queue = { path = "../../crates/rannoch-queue" }
rannoch-cloudevents = { path = "../../crates/rannoch-cloudevents" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v7"] }
rusqlite = { version = "0.40", features = ["bundled"] }

[workspace]
